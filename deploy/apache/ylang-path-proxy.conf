# Ylang gateway exposed as a PATH on an already-resolving host — no new DNS record.
#
# Why: Cursor routes BYOK model calls through its cloud, which rejects RFC1918
# targets with "Provider returned error: Access to private networks is
# forbidden". A LAN URL such as http://192.168.1.25:8787/v1 can therefore never
# work, and port 8787 is not forwarded. Reusing an existing HTTPS vhost gives a
# public origin without touching DNS.
#
# This snippet is INSERTED into an existing *:443 VirtualHost by
# install-ylang-path-proxy.sh (default: 010-stelliane.dev.conf).
#
# Only /v1/* and /health are proxied — /console and /mcp stay private.
#
# Cursor Settings -> Models:
#   OpenAI API Key           = YLANG_AUTH_TOKEN
#   Override OpenAI Base URL = https://stelliane.dev/ylang/v1
#   Model                    = gpt-4o-mini   (aliased to local Ollama)

    # BEGIN ylang-gateway
    ProxyPass        /ylang/v1/ http://127.0.0.1:8787/v1/ timeout=600 retry=0
    ProxyPassReverse /ylang/v1/ http://127.0.0.1:8787/v1/
    ProxyPass        /ylang/v1 http://127.0.0.1:8787/v1 timeout=600 retry=0
    ProxyPassReverse /ylang/v1 http://127.0.0.1:8787/v1
    ProxyPass        /ylang/health http://127.0.0.1:8787/health
    ProxyPassReverse /ylang/health http://127.0.0.1:8787/health

    # Cursor streams responses; keep Apache from buffering SSE
    <LocationMatch "^/ylang/v1">
        SetEnv proxy-sendchunked 1
        RequestHeader unset Accept-Encoding
    </LocationMatch>
    # END ylang-gateway
