# OPTIONAL — only if you explicitly want a public HTTPS front for Ylang.
# Not required for LAN / SSH-tunnel Cursor setups.
# Install: sudo ./install-ylang-vhost.sh
# Disable: sudo a2dissite ylang.stelliane.dev.conf && sudo systemctl reload apache2
#
# Cursor Override OpenAI Base URL (if using this vhost): https://ylang.stelliane.dev/v1
# Prefer custom model id ylang-mini over built-in gpt-4o-mini.

<VirtualHost *:80>
    ServerName ylang.stelliane.dev

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory "/var/www/letsencrypt/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/ylang.stelliane.dev.error.log
    CustomLog ${APACHE_LOG_DIR}/ylang.stelliane.dev.access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName ylang.stelliane.dev

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/stelliane.dev/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/stelliane.dev/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    ProxyTimeout 600

    # SSE / streaming chat completions — do not buffer
    <Location /v1/>
        SetEnv proxy-sendchunked 1
        RequestHeader unset Accept-Encoding
    </Location>

    ProxyPass / http://127.0.0.1:8787/ timeout=600
    ProxyPassReverse / http://127.0.0.1:8787/

    ErrorLog ${APACHE_LOG_DIR}/ylang.stelliane.dev.error.log
    CustomLog ${APACHE_LOG_DIR}/ylang.stelliane.dev.access.log combined
</VirtualHost>
</IfModule>
