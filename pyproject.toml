[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ylang"
version = "0.5.2"
description = "Personal AI efficiency layer – MCP server, gateway, and admin console"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["mcp", "llm", "prompt-engineering", "cursor", "litellm"]
authors = [{ name = "Yann" }]
dependencies = [
    "mcp>=1.27,<2",
    "litellm>=1.40,<2",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "httpx2>=2",
    "pyright>=1.1.390",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]
otel = [
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[project.scripts]
ylang = "ylang.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ylang"]

[tool.hatch.build.targets.wheel.force-include]
"src/ylang/console/static" = "ylang/console/static"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "llm_e2e: optional smoke tests requiring a reachable OLLAMA_HOST",
]
